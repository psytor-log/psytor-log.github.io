<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Source Serif Pro', 'Noto Serif KR', Georgia, serif; }
      .label { letter-spacing: 1.8px; font-weight: 600; }
      .eyebrow { letter-spacing: 2.2px; font-weight: 700; }
      .muted { fill: #6b6b6b; }
      .text { fill: #222222; }
      .accent { fill: #245c4f; }
    </style>
    <linearGradient id="coverImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6efe8"/>
      <stop offset="100%" stop-color="#c8d8cd"/>
    </linearGradient>
  </defs>

  <!-- page bg (slightly cooler than site to feel like an "app shell") -->
  <rect width="1440" height="980" fill="#f6f4ee"/>

  <!-- ============== TOP BAR ============== -->
  <g>
    <rect x="0" y="0" width="1440" height="56" fill="#ffffff"/>
    <line x1="0" y1="56" x2="1440" y2="56" stroke="#dedbd3"/>
    <text x="24" y="35" font-size="15" font-weight="700" class="text">What I Think</text>
    <text x="156" y="35" font-size="13" class="muted">Editor</text>
    <!-- breadcrumb -->
    <text x="220" y="35" font-size="13" class="muted">Essay  ›  조용한 도구를 만드는 일에 대하여</text>

    <!-- save/publish actions on the right -->
    <g transform="translate(960, 12)" font-size="13">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#ffffff" stroke="#dedbd3"/>
      <text x="60" y="20" text-anchor="middle" class="muted">Save draft</text>

      <rect x="132" y="0" width="120" height="32" rx="6" fill="#ffffff" stroke="#dedbd3"/>
      <text x="192" y="20" text-anchor="middle" class="muted">Preview ↗</text>

      <rect x="264" y="0" width="140" height="32" rx="6" fill="#245c4f"/>
      <text x="334" y="20" text-anchor="middle" fill="#ffffff" font-weight="600">Publish to main</text>
    </g>
    <!-- user -->
    <g transform="translate(1390, 18)">
      <circle cx="10" cy="10" r="12" fill="#245c4f"/>
      <text x="10" y="14" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">P</text>
    </g>
  </g>

  <!-- ============== LEFT SIDEBAR ============== -->
  <g>
    <rect x="0" y="56" width="240" height="924" fill="#ffffff"/>
    <line x1="240" y1="56" x2="240" y2="980" stroke="#dedbd3"/>

    <text x="24" y="100" font-size="11" class="eyebrow muted">COLLECTIONS</text>

    <g font-size="14" transform="translate(0, 120)">
      <!-- Pages -->
      <g transform="translate(0, 0)">
        <rect x="12" y="0" width="216" height="36" rx="6" fill="transparent"/>
        <text x="24" y="22" class="text">Pages</text>
        <text x="200" y="22" text-anchor="end" class="muted">1</text>
      </g>
      <!-- Essay - active -->
      <g transform="translate(0, 44)">
        <rect x="12" y="0" width="216" height="36" rx="6" fill="#e6f0ec"/>
        <rect x="12" y="0" width="3" height="36" fill="#245c4f"/>
        <text x="24" y="22" class="text" font-weight="600">Essay</text>
        <text x="200" y="22" text-anchor="end" class="accent" font-weight="600">47</text>
      </g>
      <g transform="translate(0, 88)">
        <text x="24" y="22" class="text">Study</text>
        <text x="200" y="22" text-anchor="end" class="muted">12</text>
      </g>
      <g transform="translate(0, 124)">
        <text x="24" y="22" class="text">Books</text>
        <text x="200" y="22" text-anchor="end" class="muted">8</text>
      </g>
      <g transform="translate(0, 160)">
        <text x="24" y="22" class="text">Portfolio</text>
        <text x="200" y="22" text-anchor="end" class="muted">3</text>
      </g>
    </g>

    <text x="24" y="360" font-size="11" class="eyebrow muted">UTILITIES</text>
    <g font-size="14" transform="translate(0, 376)">
      <text x="24" y="22" class="text">Media library</text>
      <text x="24" y="58" class="text">Tags</text>
      <text x="24" y="94" class="text">Drafts</text>
      <text x="200" y="94" text-anchor="end" class="muted" font-size="11">3</text>
    </g>

    <!-- bottom info -->
    <g transform="translate(0, 880)">
      <line x1="12" y1="0" x2="228" y2="0" stroke="#dedbd3"/>
      <text x="24" y="26" font-size="12" class="muted">main · synced</text>
      <circle cx="220" cy="22" r="4" fill="#245c4f"/>
    </g>
  </g>

  <!-- ============== EDIT FORM (CENTER) ============== -->
  <g transform="translate(240, 56)">
    <rect x="0" y="0" width="600" height="924" fill="#fbfaf7"/>
    <line x1="600" y1="0" x2="600" y2="924" stroke="#dedbd3"/>

    <g transform="translate(40, 32)">
      <text x="0" y="0" font-size="11" class="eyebrow muted">EDITING · ESSAY</text>

      <!-- Title -->
      <text x="0" y="60" font-size="32" font-weight="700" class="serif text">조용한 도구를 만드는 일에 대하여</text>
      <line x1="0" y1="78" x2="520" y2="78" stroke="#dedbd3"/>

      <!-- meta row: date + tags -->
      <g transform="translate(0, 108)" font-size="12">
        <text x="0" y="0" class="label muted">DATE</text>
        <text x="0" y="22" class="text" font-size="14">2026 · 05 · 18  ·  18:42</text>

        <text x="200" y="0" class="label muted">TAGS</text>
        <g transform="translate(200, 12)">
          <rect x="0" y="0" width="60" height="24" rx="12" fill="#ffffff" stroke="#dedbd3"/>
          <text x="14" y="16" font-size="12" class="muted">writing</text>
          <rect x="70" y="0" width="48" height="24" rx="12" fill="#ffffff" stroke="#dedbd3"/>
          <text x="82" y="16" font-size="12" class="muted">tools</text>
          <rect x="128" y="0" width="66" height="24" rx="12" fill="#ffffff" stroke="#dedbd3"/>
          <text x="142" y="16" font-size="12" class="muted">slowweb</text>
          <rect x="204" y="0" width="26" height="24" rx="12" fill="#ffffff" stroke="#dedbd3" stroke-dasharray="3 3"/>
          <text x="217" y="17" text-anchor="middle" font-size="12" class="muted">+</text>
        </g>

        <text x="420" y="0" class="label muted">STATUS</text>
        <g transform="translate(420, 8)">
          <rect x="0" y="0" width="56" height="24" rx="12" fill="#e6f0ec"/>
          <circle cx="12" cy="12" r="4" fill="#245c4f"/>
          <text x="22" y="16" font-size="11" class="accent" font-weight="600">DRAFT</text>
        </g>
      </g>

      <!-- Summary -->
      <text x="0" y="190" font-size="11" class="eyebrow muted">SUMMARY</text>
      <rect x="0" y="200" width="520" height="68" rx="6" fill="#ffffff" stroke="#dedbd3"/>
      <text x="14" y="222" font-size="13" class="body">하나의 글쓰기 도구를 길게 쓴다는 것은 결국 자신의 사고 방식을</text>
      <text x="14" y="240" font-size="13" class="body">한 줄씩 다듬어가는 일과 비슷하다.</text>
      <text x="500" y="262" text-anchor="end" font-size="11" class="muted">68 / 200</text>

      <!-- Cover -->
      <text x="0" y="300" font-size="11" class="eyebrow muted">COVER IMAGE</text>
      <rect x="0" y="310" width="240" height="120" rx="8" fill="url(#coverImg)" stroke="#dedbd3"/>
      <text x="120" y="376" text-anchor="middle" font-size="13" class="muted">cover-2026-05-18.jpg</text>
      <g transform="translate(258, 318)" font-size="12">
        <rect x="0" y="0" width="92" height="28" rx="6" fill="#ffffff" stroke="#dedbd3"/>
        <text x="46" y="18" text-anchor="middle" class="muted">Replace</text>
        <rect x="0" y="36" width="92" height="28" rx="6" fill="#ffffff" stroke="#dedbd3"/>
        <text x="46" y="54" text-anchor="middle" class="muted">Remove</text>
        <text x="0" y="88" font-size="11" class="muted">4:3 권장</text>
        <text x="0" y="104" font-size="11" class="muted">최대 1600×1200</text>
      </g>

      <!-- Markdown toolbar -->
      <g transform="translate(0, 466)">
        <text x="0" y="0" font-size="11" class="eyebrow muted">BODY</text>
        <rect x="0" y="14" width="520" height="40" rx="6" fill="#ffffff" stroke="#dedbd3"/>
        <g font-size="13" class="text" transform="translate(14, 38)">
          <text x="0" y="0" font-weight="700">B</text>
          <text x="22" y="0" font-style="italic">I</text>
          <text x="38" y="0">H1</text>
          <text x="64" y="0">H2</text>
          <text x="90" y="0">“</text>
          <text x="110" y="0">{ }</text>
          <text x="142" y="0">— Img</text>
          <text x="196" y="0">⛓ Link</text>
          <text x="254" y="0">• List</text>
          <text x="304" y="0">≣ Table</text>
        </g>

        <!-- Editor area -->
        <rect x="0" y="62" width="520" height="340" rx="6" fill="#ffffff" stroke="#dedbd3"/>
        <g font-size="14" class="text" transform="translate(20, 92)">
          <text x="0" y="0" font-weight="700">## 시작</text>
          <text x="0" y="32">하나의 도구를 오래 쓴다는 건 결국 사고를 정제하는 일이다.</text>
          <text x="0" y="56">자판 위에서 단어가 떠오를 때까지 기다리는 그 시간이 누적되면</text>
          <text x="0" y="80">사고의 결이 도구를 닮아간다.</text>
          <text x="0" y="120" font-weight="700">## 한 해의 정리</text>
          <text x="0" y="144">작년 봄에 이 사이트를 다시 짓기 시작했다. 처음에는 Notion에서</text>
          <text x="0" y="168">옮겨오는 일이었다. 그러다가 점차 ...</text>
          <!-- inline image embed -->
          <g transform="translate(0, 188)">
            <rect x="0" y="0" width="480" height="80" rx="6" fill="#fbfaf7" stroke="#dedbd3" stroke-dasharray="4 3"/>
            <rect x="14" y="12" width="56" height="56" rx="4" fill="url(#coverImg)" stroke="#dedbd3"/>
            <text x="86" y="32" font-size="13" font-weight="600" class="text">— Image · workspace.jpg</text>
            <text x="86" y="50" font-size="12" class="muted">Width 60%  ·  Align center  ·  Caption: 책상 위의 풍경</text>
          </g>
        </g>
        <text x="510" y="412" text-anchor="end" font-size="11" class="muted">847 chars · 6 min read · saved 2s ago ⏵ autosaved</text>
      </g>
    </g>
  </g>

  <!-- ============== LIVE PREVIEW PANE ============== -->
  <g transform="translate(840, 56)">
    <rect x="0" y="0" width="600" height="924" fill="#fbfaf7"/>

    <!-- preview header -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="552" height="32" rx="6" fill="#ffffff" stroke="#dedbd3"/>
      <circle cx="14" cy="16" r="4" fill="#245c4f"/>
      <text x="28" y="20" font-size="12" class="muted">Live preview  ·  matches /essay/&lt;slug&gt;/</text>
      <text x="540" y="20" text-anchor="end" font-size="11" class="muted">↻ refresh on save</text>
    </g>

    <!-- the actual styled preview (mirrors site) -->
    <g transform="translate(48, 88)">
      <text x="0" y="0" font-size="11" class="eyebrow accent">ESSAY · 12 MIN READ</text>
      <text x="0" y="56" font-size="34" font-weight="700" class="serif text">조용한 도구를</text>
      <text x="0" y="92" font-size="34" font-weight="700" class="serif text">만드는 일에 대하여</text>
      <text x="0" y="124" font-size="13" class="muted">2026·05·18 · 18:42  /  essay</text>

      <g transform="translate(0, 140)" font-size="12" class="muted">
        <rect x="0" y="0" width="60" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="14" y="15">writing</text>
        <rect x="70" y="0" width="48" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="82" y="15">tools</text>
        <rect x="128" y="0" width="66" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="142" y="15">slowweb</text>
      </g>

      <!-- cover -->
      <rect x="0" y="180" width="504" height="200" rx="8" fill="url(#coverImg)" stroke="#dedbd3"/>

      <!-- body -->
      <g font-size="15" class="body">
        <text x="0" y="416">하나의 도구를 오래 쓴다는 건 결국 사고를 정제하는 일이다.</text>
        <text x="0" y="440">자판 위에서 단어가 떠오를 때까지 기다리는 그 시간이</text>
        <text x="0" y="464">누적되면 사고의 결이 도구를 닮아간다.</text>
      </g>
      <text x="0" y="510" font-size="20" font-weight="700" class="serif text">한 해의 정리</text>
      <g font-size="15" class="body">
        <text x="0" y="540">작년 봄에 이 사이트를 다시 짓기 시작했다. 처음에는 Notion에서</text>
        <text x="0" y="564">옮겨오는 일이었다. 그러다가 점차 ...</text>
      </g>

      <!-- embedded cms-image preview -->
      <g transform="translate(50, 600)">
        <rect x="0" y="0" width="404" height="120" rx="6" fill="url(#coverImg)" stroke="#dedbd3"/>
        <text x="202" y="142" text-anchor="middle" font-size="12" class="muted">책상 위의 풍경</text>
      </g>
    </g>
  </g>

  <!-- ============== ANNOTATIONS ============== -->
  <g font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#b3633c">
    <text x="24" y="76">① Sidebar shows post counts + active highlight strip</text>
    <text x="280" y="76">② Title uses the site's serif font — author sees real typography</text>
    <text x="280" y="232">③ Status pill (DRAFT / PUBLISHED) replaces hidden boolean</text>
    <text x="280" y="392">④ Cover image with aspect-ratio guideline visible</text>
    <text x="864" y="76">⑤ Live preview pane mirrors actual /essay/&lt;slug&gt;/ output</text>
    <text x="864" y="970">⑥ Embedded "sized-image" widget renders exactly as on site</text>
  </g>
</svg>
