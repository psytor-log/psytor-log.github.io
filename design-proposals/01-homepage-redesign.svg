<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Source Serif Pro', 'Noto Serif KR', Georgia, serif; }
      .eyebrow { letter-spacing: 2.5px; font-weight: 700; }
      .label { letter-spacing: 1.8px; font-weight: 600; }
      .muted { fill: #6b6b6b; }
      .accent { fill: #245c4f; }
      .text { fill: #222222; }
      .body { fill: #4b4b4b; }
    </style>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6efe8"/>
      <stop offset="100%" stop-color="#c8d8cd"/>
    </linearGradient>
    <linearGradient id="thumbB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2e6dc"/>
      <stop offset="100%" stop-color="#d9bda4"/>
    </linearGradient>
    <linearGradient id="thumbC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9e4d6"/>
      <stop offset="100%" stop-color="#cdc5ad"/>
    </linearGradient>
    <linearGradient id="thumbD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe6ee"/>
      <stop offset="100%" stop-color="#b8c7d6"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="1280" height="1820" fill="#fbfaf7"/>

  <!-- ============== HEADER ============== -->
  <g>
    <line x1="120" y1="86" x2="1160" y2="86" stroke="#dedbd3" stroke-width="1"/>
    <text x="120" y="53" font-size="20" font-weight="700" class="text">What I Think</text>
    <g font-size="15" class="muted">
      <text x="720" y="53">Home</text>
      <text x="788" y="53" class="accent" font-weight="600">Essay</text>
      <rect x="788" y="64" width="40" height="2" fill="#245c4f"/>
      <text x="855" y="53">Study</text>
      <text x="918" y="53">Books</text>
      <text x="983" y="53">Portfolio</text>
      <text x="1078" y="53">About</text>
    </g>
    <!-- Search icon -->
    <g transform="translate(1140, 40)" stroke="#6b6b6b" stroke-width="1.6" fill="none">
      <circle cx="6" cy="6" r="6"/>
      <line x1="10.5" y1="10.5" x2="16" y2="16"/>
    </g>
  </g>

  <!-- ============== HERO ============== -->
  <g transform="translate(120, 150)">
    <text x="0" y="0" font-size="12" class="eyebrow accent">THINKING LOG · ESTABLISHED 2026</text>
    <text x="0" y="118" font-size="104" font-weight="700" class="serif text">What I Think.</text>
    <text x="0" y="180" font-size="20" class="body">생각, 공부, 독서, 프로젝트를 Markdown으로 쌓아 두는</text>
    <text x="0" y="208" font-size="20" class="body">조용한 개인 홈페이지.</text>

    <!-- Inline stats strip -->
    <g transform="translate(0, 256)">
      <line x1="0" y1="0" x2="1040" y2="0" stroke="#dedbd3"/>
      <line x1="0" y1="92" x2="1040" y2="92" stroke="#dedbd3"/>
      <g font-size="12" class="label muted">
        <text x="0" y="32">ESSAYS</text>
        <text x="220" y="32">STUDIES</text>
        <text x="440" y="32">BOOKS</text>
        <text x="660" y="32">PORTFOLIO</text>
        <text x="880" y="32">LAST UPDATED</text>
      </g>
      <g font-size="34" font-weight="600" class="text serif">
        <text x="0" y="74">47</text>
        <text x="220" y="74">12</text>
        <text x="440" y="74">8</text>
        <text x="660" y="74">3</text>
        <text x="880" y="74" font-size="18" font-weight="500">2026·05·18</text>
      </g>
    </g>
  </g>

  <!-- ============== FEATURED LATEST ============== -->
  <g transform="translate(120, 520)">
    <text x="0" y="0" font-size="12" class="eyebrow muted">LATEST</text>
    <line x1="60" y1="-6" x2="1040" y2="-6" stroke="#dedbd3"/>

    <!-- Big card -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="500" height="320" rx="10" fill="url(#thumbA)"/>
      <!-- subtle frame -->
      <rect x="0" y="0" width="500" height="320" rx="10" fill="none" stroke="#dedbd3"/>
      <g transform="translate(540, 8)">
        <text x="0" y="0" font-size="12" class="label accent">ESSAY · 12 MIN READ</text>
        <text x="0" y="56" font-size="36" font-weight="700" class="serif text">조용한 도구를 만드는 일에 대하여</text>
        <text x="0" y="100" font-size="16" class="body">하나의 글쓰기 도구를 길게 쓴다는 것은 결국 자신의 사고 방식을</text>
        <text x="0" y="124" font-size="16" class="body">한 줄씩 다듬어가는 일과 비슷하다. 이 글에서는 작년 한 해 동안</text>
        <text x="0" y="148" font-size="16" class="body">개인 홈페이지를 다시 짓는 과정에서 배운 것들을 정리한다.</text>

        <!-- tags -->
        <g transform="translate(0, 184)" font-size="13" class="muted">
          <rect x="0" y="-16" width="64" height="28" rx="14" fill="#ffffff" stroke="#dedbd3"/>
          <text x="14" y="3">writing</text>
          <rect x="76" y="-16" width="56" height="28" rx="14" fill="#ffffff" stroke="#dedbd3"/>
          <text x="89" y="3">tools</text>
          <rect x="144" y="-16" width="72" height="28" rx="14" fill="#ffffff" stroke="#dedbd3"/>
          <text x="158" y="3">slowweb</text>
        </g>

        <g transform="translate(0, 248)" font-size="13" class="muted">
          <text x="0" y="0">2026·05·18  ·  written in 38 min  ·  by psytor</text>
        </g>
        <!-- read button -->
        <g transform="translate(0, 270)">
          <rect x="0" y="0" width="148" height="40" rx="20" fill="#245c4f"/>
          <text x="74" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Read essay  →</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============== CATEGORY STRIP ============== -->
  <g transform="translate(120, 920)">
    <text x="0" y="0" font-size="12" class="eyebrow muted">SECTIONS</text>
    <line x1="80" y1="-6" x2="1040" y2="-6" stroke="#dedbd3"/>

    <g transform="translate(0, 28)">
      <!-- Essay -->
      <g>
        <rect x="0" y="0" width="252" height="120" rx="10" fill="#ffffff" stroke="#dedbd3"/>
        <rect x="0" y="0" width="4" height="120" fill="#245c4f"/>
        <text x="22" y="34" font-size="18" font-weight="700" class="text">Essay</text>
        <text x="22" y="60" font-size="13" class="muted">생각·관찰·삶의 기록</text>
        <text x="22" y="98" font-size="13" class="muted">47 posts  ·  updated 2d ago →</text>
      </g>
      <!-- Study -->
      <g transform="translate(263, 0)">
        <rect x="0" y="0" width="252" height="120" rx="10" fill="#ffffff" stroke="#dedbd3"/>
        <rect x="0" y="0" width="4" height="120" fill="#b3633c"/>
        <text x="22" y="34" font-size="18" font-weight="700" class="text">Study</text>
        <text x="22" y="60" font-size="13" class="muted">개념·도구 정리</text>
        <text x="22" y="98" font-size="13" class="muted">12 posts  ·  updated 5d ago →</text>
      </g>
      <!-- Books -->
      <g transform="translate(526, 0)">
        <rect x="0" y="0" width="252" height="120" rx="10" fill="#ffffff" stroke="#dedbd3"/>
        <rect x="0" y="0" width="4" height="120" fill="#7c6a3a"/>
        <text x="22" y="34" font-size="18" font-weight="700" class="text">Books</text>
        <text x="22" y="60" font-size="13" class="muted">읽은 책과 남은 문장</text>
        <text x="22" y="98" font-size="13" class="muted">8 posts  ·  updated 1w ago →</text>
      </g>
      <!-- Portfolio -->
      <g transform="translate(789, 0)">
        <rect x="0" y="0" width="252" height="120" rx="10" fill="#ffffff" stroke="#dedbd3"/>
        <rect x="0" y="0" width="4" height="120" fill="#3a5a78"/>
        <text x="22" y="34" font-size="18" font-weight="700" class="text">Portfolio</text>
        <text x="22" y="60" font-size="13" class="muted">만든 것·실험</text>
        <text x="22" y="98" font-size="13" class="muted">3 posts  ·  updated 2w ago →</text>
      </g>
    </g>
  </g>

  <!-- ============== RECENT POSTS ============== -->
  <g transform="translate(120, 1130)">
    <g>
      <text x="0" y="0" font-size="12" class="eyebrow muted">RECENT</text>
      <line x1="76" y1="-6" x2="940" y2="-6" stroke="#dedbd3"/>
      <text x="950" y="2" font-size="13" class="accent" font-weight="600">View all  →</text>
    </g>

    <!-- Item 1 (hovered - soft bg) -->
    <g transform="translate(0, 22)">
      <rect x="-20" y="0" width="1080" height="116" rx="8" fill="#f3efe6"/>
      <text x="0" y="38" font-size="13" class="muted">2026·05·18 · 18:42</text>
      <text x="0" y="60" font-size="11" class="label accent">ESSAY · 12 MIN</text>
      <!-- thumbnail -->
      <rect x="180" y="20" width="116" height="86" rx="6" fill="url(#thumbA)" stroke="#dedbd3"/>
      <text x="316" y="42" font-size="20" font-weight="700" class="text">조용한 도구를 만드는 일에 대하여</text>
      <text x="316" y="68" font-size="14" class="body">하나의 글쓰기 도구를 길게 쓴다는 것은 자신의 사고 방식을 다듬는 일과 비슷하다.</text>
      <g transform="translate(316, 86)" font-size="12" class="muted">
        <rect x="0" y="-12" width="62" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="14" y="3">writing</text>
        <rect x="72" y="-12" width="54" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="86" y="3">tools</text>
      </g>
      <line x1="-20" y1="116" x2="1060" y2="116" stroke="#dedbd3"/>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 138)">
      <text x="0" y="38" font-size="13" class="muted">2026·05·15 · 09:12</text>
      <text x="0" y="60" font-size="11" class="label accent" fill="#b3633c">STUDY · 6 MIN</text>
      <rect x="180" y="20" width="116" height="86" rx="6" fill="url(#thumbB)" stroke="#dedbd3"/>
      <text x="316" y="42" font-size="20" font-weight="700" class="text">Astro의 import.meta.glob 다시 읽기</text>
      <text x="316" y="68" font-size="14" class="body">정적 사이트의 콘텐츠 로딩이 빌드 타임에 어떻게 묶이는지 짚어둔다.</text>
      <g transform="translate(316, 86)" font-size="12" class="muted">
        <rect x="0" y="-12" width="46" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="13" y="3">astro</text>
        <rect x="56" y="-12" width="44" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="68" y="3">build</text>
      </g>
      <line x1="-20" y1="116" x2="1060" y2="116" stroke="#dedbd3"/>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 254)">
      <text x="0" y="38" font-size="13" class="muted">2026·05·11 · 22:08</text>
      <text x="0" y="60" font-size="11" class="label" fill="#7c6a3a">BOOKS · 4 MIN</text>
      <rect x="180" y="20" width="116" height="86" rx="6" fill="url(#thumbC)" stroke="#dedbd3"/>
      <text x="316" y="42" font-size="20" font-weight="700" class="text">『고독의 위로』 — 다시 읽기 노트</text>
      <text x="316" y="68" font-size="14" class="body">두 번째 읽으니 처음 줄친 문장 옆에 새로운 줄이 늘었다.</text>
      <g transform="translate(316, 86)" font-size="12" class="muted">
        <rect x="0" y="-12" width="60" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="14" y="3">reread</text>
        <rect x="70" y="-12" width="54" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="84" y="3">essay</text>
      </g>
      <line x1="-20" y1="116" x2="1060" y2="116" stroke="#dedbd3"/>
    </g>

    <!-- Item 4 (no thumbnail) -->
    <g transform="translate(0, 370)">
      <text x="0" y="38" font-size="13" class="muted">2026·05·07 · 14:30</text>
      <text x="0" y="60" font-size="11" class="label" fill="#3a5a78">PORTFOLIO · 8 MIN</text>
      <text x="180" y="42" font-size="20" font-weight="700" class="text">개인 글쓰기 도구를 정적 사이트로 다시 짓기</text>
      <text x="180" y="68" font-size="14" class="body">한 달 간의 작업 일지. 무엇을 버리고 무엇을 남겼는지.</text>
      <g transform="translate(180, 86)" font-size="12" class="muted">
        <rect x="0" y="-12" width="56" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="12" y="3">astro</text>
        <rect x="66" y="-12" width="60" height="22" rx="11" fill="#ffffff" stroke="#dedbd3"/>
        <text x="80" y="3">rewrite</text>
      </g>
      <line x1="-20" y1="116" x2="1060" y2="116" stroke="#dedbd3"/>
    </g>
  </g>

  <!-- ============== FOOTER ============== -->
  <g transform="translate(120, 1660)">
    <line x1="-20" y1="0" x2="1060" y2="0" stroke="#dedbd3"/>
    <text x="0" y="44" font-size="14" font-weight="700" class="text">What I Think</text>
    <text x="0" y="68" font-size="12" class="muted">Thinking log by psytor · © 2026 psytor</text>
    <g transform="translate(720, 40)" font-size="13" class="muted">
      <text x="0" y="14">GitHub</text>
      <text x="80" y="14">RSS</text>
      <text x="130" y="14">Sitemap</text>
      <text x="220" y="14">/admin/</text>
    </g>
    <!-- theme toggle -->
    <g transform="translate(960, 30)">
      <rect x="0" y="0" width="80" height="32" rx="16" fill="#ffffff" stroke="#dedbd3"/>
      <circle cx="16" cy="16" r="10" fill="#245c4f"/>
      <text x="36" y="20" font-size="11" class="muted">Light</text>
    </g>
  </g>

  <!-- ============== ANNOTATION TAGS ============== -->
  <g font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#b3633c">
    <text x="120" y="138">① Serif display headline (Source Serif / Noto Serif KR)</text>
    <text x="120" y="416">② Activity stats strip — adds at-a-glance density</text>
    <text x="120" y="510">③ Featured "Latest" card replaces flat hero list</text>
    <text x="120" y="908">④ Color-stripe per category for visual rhythm</text>
    <text x="120" y="1120">⑤ Compact list w/ category badge + read-time</text>
    <text x="120" y="1654">⑥ Footer: GitHub / RSS / Sitemap / theme toggle</text>
  </g>
</svg>
