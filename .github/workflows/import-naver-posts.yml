name: Import Naver Posts

on:
  schedule:
    # 06:10 KST daily. GitHub schedules use UTC.
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of posts to import"
        required: false
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: naver-import
  cancel-in-progress: false

jobs:
  import-build-deploy:
    runs-on: ubuntu-latest
    env:
      NAVER_IMPORT_LIMIT: ${{ github.event.inputs.limit || '3' }}
      NAVER_BLOG_ID: coaching_blog
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Naver posts
        run: npm run import:naver -- --limit "$NAVER_IMPORT_LIMIT"

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Smoke test built admin
        run: npm run test:smoke

      - name: Commit import results
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No import changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content public/images/uploads NAVER_IMPORT_REPORT.md
          git commit -m "chore: import Naver blog drafts"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
