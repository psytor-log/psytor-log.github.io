backend:
  name: github
  repo: psytor-log/psytor-log.github.io
  branch: main
  base_url: https://psytor-log-decap-oauth.dejangbu.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "Create {{collection}} post: {{slug}}"
    update: "Update {{collection}} post: {{slug}}"
    delete: "Delete {{collection}} post: {{slug}}"
    uploadMedia: "Upload media: {{path}}"
    deleteMedia: "Delete media: {{path}}"

local_backend: true

site_url: https://psytor-log.github.io
display_url: https://psytor-log.github.io
locale: ko

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "unicode"
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "site"
        label: "사이트 공통 텍스트"
        file: "content/pages/site.md"
        format: "frontmatter"
        fields:
          - { label: "브랜드명", name: "brand", widget: "string", hint: "헤더 좌측·푸터 좌측·기본 페이지 제목에 사용됩니다." }
          - { label: "사이트 설명 (메타)", name: "description", widget: "string", hint: "각 페이지가 자기 description 을 안 줄 때 쓰는 기본값." }
          - label: "메뉴 텍스트"
            name: "menu"
            widget: "object"
            hint: "헤더 네비게이션에 표시되는 라벨. 링크 경로는 사이트 구조에 묶여 있어 변경되지 않습니다."
            fields:
              - { label: "Home", name: "home", widget: "string" }
              - { label: "Essay", name: "essay", widget: "string" }
              - { label: "Study", name: "study", widget: "string" }
              - { label: "Books", name: "books", widget: "string" }
              - { label: "Portfolio", name: "portfolio", widget: "string" }
              - { label: "Vestigo", name: "ichnos", widget: "string" }
              - { label: "About", name: "about", widget: "string" }
          - label: "푸터"
            name: "footer"
            widget: "object"
            fields:
              - { label: "브랜드명 (푸터)", name: "brand", widget: "string" }
              - { label: "한 줄 설명 / 저작권", name: "tagline", widget: "string" }
              - { label: "Admin 링크 라벨", name: "admin_label", widget: "string" }
              - { label: "Today 라벨", name: "today_label", widget: "string" }
              - { label: "Total 라벨", name: "total_label", widget: "string" }

      - name: "home"
        label: "홈 페이지"
        file: "content/pages/home.md"
        format: "frontmatter"
        preview_path: ""
        fields:
          - { label: "히어로 상단 라벨", name: "hero_eyebrow", widget: "string", hint: "예: Thinking Log" }
          - { label: "히어로 제목", name: "hero_title", widget: "string" }
          - { label: "히어로 설명", name: "hero_lead", widget: "text", hint: "홈 상단의 한두 줄 소개." }
          - label: "카테고리 박스"
            name: "categories"
            widget: "list"
            hint: "홈 화면 4분할 박스. key 는 URL/색상 구분에 묶여 있어 변경하면 색이 깨질 수 있습니다."
            fields:
              - { label: "키", name: "key", widget: "select", options: ["essay", "study", "books", "portfolio", "ichnos"] }
              - { label: "이름", name: "name", widget: "string" }
              - { label: "설명", name: "description", widget: "string" }
              - { label: "링크", name: "href", widget: "string" }
          - { label: "Latest 섹션 라벨", name: "section_featured_label", widget: "string", hint: "최근 글 카드 위에 표시됩니다." }
          - { label: "Recent 섹션 라벨", name: "section_recent_label", widget: "string" }
          - { label: "View all 링크 텍스트", name: "section_view_all_label", widget: "string" }
          - { label: "View all 링크 경로", name: "section_view_all_href", widget: "string", hint: "기본 /archive/ (전체 글 최신순). 특정 카테고리로 바꾸려면 /essay/ 등." }
          - { label: "Read 버튼 템플릿", name: "read_button_label_template", widget: "string", hint: "{category} 자리에 카테고리명이 들어갑니다. 예: 'Read {category}  →'" }

      - name: "about"
        label: "About"
        file: "content/pages/about.md"
        format: "frontmatter"
        preview_path: "about/"
        fields:
          - { label: "제목", name: "title", widget: "string" }
          - { label: "요약", name: "summary", widget: "text" }
          - { label: "상단 라벨", name: "eyebrow", widget: "string", default: "About" }
          - { label: "본문", name: "body", widget: "markdown", buttons: ["bold", "italic", "link", "heading-one", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list", "code"], editor_components: ["sized-image"] }

      - name: "ichnos"
        label: "Vestigo (발자취)"
        file: "content/pages/ichnos.md"
        format: "frontmatter"
        preview_path: "ichnos/"
        fields:
          - { label: "제목", name: "title", widget: "string", default: "Vestigo" }
          - { label: "상단 라벨", name: "eyebrow", widget: "string", default: "발자취" }
          - { label: "설명", name: "summary", widget: "text", hint: "페이지 상단 한두 줄 소개." }
          - label: "발자취 기록"
            name: "entries"
            widget: "list"
            label_singular: "기록 한 줄"
            add_to_top: true
            summary: "{{fields.date}} · {{fields.text}}"
            hint: "특별한 이벤트나 기억할 만한 날을 날짜와 한 줄로 남깁니다. 순서는 상관없이 사이트에서 최신 날짜가 위로 정렬됩니다."
            fields:
              - { label: "날짜", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "년-월-일 (KST)." }
              - { label: "내용 (한 줄)", name: "text", widget: "string", hint: "그날 있었던 일을 한 줄로." }

  - name: "essay"
    label: "Essay"
    label_singular: "Essay 글"
    folder: "content/essay"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "{{category}}/{{slug}}/"
    fields:
      - { label: "제목", name: "title", widget: "string", hint: "독자가 가장 먼저 보는 한 줄. 60자 이내 권장." }
      - { label: "작성일시", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss.SSSZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "KST 기준. 빈 칸은 현재 시각으로 채워집니다." }
      - label: "게시판 변경"
        name: "category"
        widget: "select"
        default: "essay"
        hint: "저장하면 이 글은 선택한 게시판 목록과 URL로 이동합니다. 예: study를 선택하면 /study/글주소/ 로 노출됩니다."
        options:
          - { label: "Essay", value: "essay" }
          - { label: "Study", value: "study" }
          - { label: "Books", value: "books" }
          - { label: "Portfolio", value: "portfolio" }
      - { label: "태그", name: "tags", widget: "list", required: false, hint: "주제 키워드 3~6개 권장.", field: { label: "태그", name: "tag", widget: "string" } }
      - { label: "요약", name: "summary", widget: "text", required: false, hint: "200자 이내. 카드와 메타 description 양쪽에 쓰입니다." }
      - { label: "대표 이미지", name: "cover", widget: "image", required: false, hint: "4:3 권장, 최대 1600×1200. 비워두면 본문 첫 이미지를 자동 사용." }
      - { label: "비공개 초안", name: "draft", widget: "boolean", default: false, required: false, hint: "켜두면 사이트에는 노출되지 않습니다 (DRAFT 표시)." }
      - { label: "원본 파일", name: "source_file", widget: "hidden", default: "cms" }
      - { label: "Import 검토 메모", name: "import_review_note", widget: "text", required: false, hint: "네이버 블로그 자동 이전 시 카테고리 판단 근거를 남깁니다." }
      - { label: "작성 도구", name: "created_by", widget: "hidden", default: "decap-cms" }
      - { label: "본문", name: "body", widget: "markdown", default_mode: "raw", modes: ["raw", "rich_text"], buttons: ["bold", "italic", "link", "heading-one", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list", "code"], editor_components: ["sized-image", "line-space"], hint: "여러 번 엔터를 쳐서 만든 빈 줄은 저장 시 실제 여백으로 보존됩니다." }

