      - { label: "카테고리", name: "category", widget: "hidden", default: "study" }
      - { label: "태그", name: "tags", widget: "list", required: false, field: { label: "태그", name: "tag", widget: "string" } }
      - { label: "요약", name: "summary", widget: "text", required: false }
      - { label: "대표 이미지", name: "cover", widget: "image", required: false }
      - { label: "비공개 초안", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "원본 파일", name: "source_file", widget: "hidden", default: "cms" }
      - { label: "작성 도구", name: "created_by", widget: "hidden", default: "decap-cms" }
      - { label: "본문", name: "body", widget: "markdown" }

