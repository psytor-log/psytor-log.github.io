        hint: "저장하면 이 글은 선택한 게시판 목록과 URL로 이동합니다. 예: essay를 선택하면 /essay/글주소/ 로 노출됩니다."
        options:
          - { label: "Essay", value: "essay" }
          - { label: "Study", value: "study" }
          - { label: "Books", value: "books" }
          - { label: "Portfolio", value: "portfolio" }
      - { label: "태그", name: "tags", widget: "list", required: false, hint: "주제 키워드 3~6개 권장.", field: { label: "태그", name: "tag", widget: "string" } }
      - { label: "요약", name: "summary", widget: "text", required: false, hint: "200자 이내. 카드와 메타 description 양쪽에 쓰입니다." }
      - { label: "대표 이미지", name: "cover", widget: "image", required: false, hint: "4:3 권장, 최대 1600×1200. 비워두면 본문 첫 이미지를 자동 사용." }
      - { label: "비공개 초안", name: "draft", widget: "boolean", default: false, required: false, hint: "켜두면 사이트에는 노출되지 않습니다 (DRAFT 표시)." }
      - { label: "원본 파일", name: "source_file", widget: "hidden", default: "cms" }
      - { label: "Import 검토 메모", name: "import_review_note", widget: "text", required: false, hint: "네이버 블로그 자동 이전 시 카테고리 판단 근거를 남깁니다." }
      - { label: "작성 도구", name: "created_by", widget: "hidden", default: "decap-cms" }
      - { label: "본문", name: "body", widget: "markdown", default_mode: "raw", modes: ["raw", "rich_text"], buttons: ["bold", "italic", "link", "heading-one", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list", "code"], editor_components: ["sized-image", "line-space"], hint: "여러 번 엔터를 쳐서 만든 빈 줄은 저장 시 실제 여백으로 보존됩니다." }

  - name: "books"
    label: "Books"
