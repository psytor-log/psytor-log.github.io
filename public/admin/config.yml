      - { label: "작성일시", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss.SSSZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "KST 기준. 빈 칸은 현재 시각으로 채워집니다." }
      - label: "게시판 변경"
